<!DOCTYPE html>

         font-family: '72', 'Segoe UI', Arial, sans-serif; }

  <text x="1280" y="48" font-family="Segoe UI, Arial" font-size="13" font-weight="700" fill="#222">FORUM</text>

       TITLE BLOCK
  ══════════════════════════ -->

  <polygon points="32,82 44,98 32,114" fill="#7B2D8B"/>
  <text x="54" y="96"
        font-family="Segoe UI, Arial" font-size="24" font-weight="700" fill="#1a1a1a">
    Product &amp; UX Assessment / Gap Analysis
  </text>
  <text x="54" y="116"
        font-family="Segoe UI, Arial" font-size="13" fill="#555">
    Current app vs. prototype vision  ·  Key findings grounded in user research and analytics
  </text>

  <!-- ══════════════════════════
       STAT PILLS  (row at y=140)
  ══════════════════════════ -->

  <!-- Stat 1: 26+ screens -->
  <rect x="32" y="136" width="164" height="62" rx="8" fill="#EEF4FF" stroke="#0070F2" stroke-width="1.5"/>
  <text x="114" y="162" text-anchor="middle"
        font-family="Segoe UI, Arial" font-size="28" font-weight="700" fill="#0070F2">26+</text>
  <text x="114" y="180" text-anchor="middle"
        font-family="Segoe UI, Arial" font-size="10" fill="#555">prototype screens mapped</text>

  <!-- Stat 2: 9 gaps -->
  <rect x="208" y="136" width="164" height="62" rx="8" fill="#FFF3D4" stroke="#F0A500" stroke-width="1.5"/>
  <text x="290" y="162" text-anchor="middle"
        font-family="Segoe UI, Arial" font-size="28" font-weight="700" fill="#C8850A">9</text>
  <text x="290" y="180" text-anchor="middle"
        font-family="Segoe UI, Arial" font-size="10" fill="#555">feature gaps identified</text>

  <!-- Stat 3: 83.8% uninstall -->
  <rect x="384" y="136" width="184" height="62" rx="8" fill="#FFF0EE" stroke="#E05A1B" stroke-width="1.5"/>
  <text x="476" y="162" text-anchor="middle"
        font-family="Segoe UI, Arial" font-size="28" font-weight="700" fill="#C84010">83.8%</text>
  <text x="476" y="180" text-anchor="middle"
        font-family="Segoe UI, Arial" font-size="10" fill="#555">Android uninstall rate</text>

  <!-- Stat 4: 3.0 rating -->
  <rect x="580" y="136" width="164" height="62" rx="8" fill="#F0F7EE" stroke="#8DC63F" stroke-width="1.5"/>
  <text x="662" y="162" text-anchor="middle"
        font-family="Segoe UI, Arial" font-size="28" font-weight="700" fill="#4A8014">3.0★</text>
  <text x="662" y="180" text-anchor="middle"
        font-family="Segoe UI, Arial" font-size="10" fill="#555">Android store rating</text>

  <!-- Stat 5: 5 unanswered reviews -->
  <rect x="756" y="136" width="184" height="62" rx="8" fill="#F5EEF8" stroke="#7B2D8B" stroke-width="1.5"/>
  <text x="848" y="162" text-anchor="middle"
        font-family="Segoe UI, Arial" font-size="28" font-weight="700" fill="#7B2D8B">5</text>
  <text x="848" y="180" text-anchor="middle"
        font-family="Segoe UI, Arial" font-size="10" fill="#555">unanswered 1-star reviews</text>

  <!-- ══════════════════════════
       TWO-COLUMN LAYOUT
       Left: Current App   Right: Prototype Vision
  ══════════════════════════ -->

  <!-- ── LEFT COLUMN: Current App ── -->
  <rect x="32" y="216" width="590" height="322" rx="8" fill="#FFF8F8" stroke="#E88" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="32" y="216" width="590" height="38" rx="8" fill="#E05A1B"/>
  <rect x="32" y="236" width="590" height="18" fill="#E05A1B"/><!-- square bottom corners -->
  <text x="327" y="241" text-anchor="middle"
        font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="white">
    CURRENT APP  —  GAPS &amp; ISSUES
  </text>

  <!-- Gap rows -->
  <!-- row helper: icon ● + text -->
  <!-- Row 1 -->
  <circle cx="58" cy="279" r="7" fill="#E05A1B"/>
  <text x="74" y="275" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#1a1a1a">Grey, minimal UI — unchanged 12+ months</text>
  <text x="74" y="292" font-family="Segoe UI, Arial" font-size="11" fill="#555">"The app is pretty absent — there's nothing in it." — Aksana, UX Designer</text>

  <!-- Row 2 -->
  <circle cx="58" cy="323" r="7" fill="#E05A1B"/>
  <text x="74" y="319" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#1a1a1a">Android image distortion bug</text>
  <text x="74" y="336" font-family="Segoe UI, Arial" font-size="11" fill="#555">Images appear "smashed" — reported for months, still unfixed</text>

  <!-- Row 3 -->
  <circle cx="58" cy="366" r="7" fill="#E05A1B"/>
  <text x="74" y="362" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#1a1a1a">No gamification visible</text>
  <text x="74" y="379" font-family="Segoe UI, Arial" font-size="11" fill="#555">ZiyoCoins exist in backend but invisible — no balance, shop, or rewards</text>

  <!-- Row 4 -->
  <circle cx="58" cy="409" r="7" fill="#E05A1B"/>
  <text x="74" y="405" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#1a1a1a">Registration via Telegram bot, not in-app</text>
  <text x="74" y="422" font-family="Segoe UI, Arial" font-size="11" fill="#555">Event sign-up runs through QR → Google Docs / Telegram outside the app</text>

  <!-- Row 5 -->
  <circle cx="58" cy="452" r="7" fill="#E05A1B"/>
  <text x="74" y="448" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#1a1a1a">Static profile, no personalisation</text>
  <text x="74" y="465" font-family="Segoe UI, Arial" font-size="11" fill="#555">No Skills &amp; CV, no history, no certificates, no interest model</text>

  <!-- Row 6 -->
  <circle cx="58" cy="495" r="7" fill="#E05A1B"/>
  <text x="74" y="491" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#1a1a1a">Single content format + no social</text>
  <text x="74" y="508" font-family="Segoe UI, Arial" font-size="11" fill="#555">Text/image only; no shorts, no podcast, no chat, no reactions</text>

  <!-- ── RIGHT COLUMN: Prototype Vision ── -->
  <rect x="638" y="216" width="663" height="322" rx="8" fill="#F4FBF4" stroke="#8DC63F" stroke-width="1.5"/>
  <!-- Header -->
  <rect x="638" y="216" width="663" height="38" rx="8" fill="#5B9A1B"/>
  <rect x="638" y="236" width="663" height="18" fill="#5B9A1B"/>
  <text x="970" y="241" text-anchor="middle"
        font-family="Segoe UI, Arial" font-size="14" font-weight="700" fill="white">
    PROTOTYPE VISION  —  WHAT IT DELIVERS
  </text>

  <!-- Prototype feature rows -->
  <circle cx="660" cy="279" r="7" fill="#5B9A1B"/>
  <text x="676" y="275" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#1a1a1a">Personalised home feed</text>
  <text x="676" y="292" font-family="Segoe UI, Arial" font-size="11" fill="#555">5 tabs (Events/Courses/Grants/Jobs/Podcasts), match-%, weekly rank header</text>

  <circle cx="660" cy="323" r="7" fill="#5B9A1B"/>
  <text x="676" y="319" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#1a1a1a">Full gamification loop</text>
  <text x="676" y="336" font-family="Segoe UI, Arial" font-size="11" fill="#555">ZiyoCoin balance on home, earn on enrolment, redeem in merch shop, leaderboard</text>

  <circle cx="660" cy="366" r="7" fill="#5B9A1B"/>
  <text x="676" y="362" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#1a1a1a">Rich content formats</text>
  <text x="676" y="379" font-family="Segoe UI, Arial" font-size="11" fill="#555">Quick Bytes (TikTok-scroll), Podcast player + transcript, Course curriculum</text>

  <circle cx="660" cy="409" r="7" fill="#5B9A1B"/>
  <text x="676" y="405" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#1a1a1a">Native event registration + QR scan</text>
  <text x="676" y="422" font-family="Segoe UI, Arial" font-size="11" fill="#555">In-app register, ticket wallet, camera-based QR check-in at venue</text>

  <circle cx="660" cy="452" r="7" fill="#5B9A1B"/>
  <text x="676" y="448" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#1a1a1a">Skills &amp; CV + Jobs &amp; Internships</text>
  <text x="676" y="465" font-family="Segoe UI, Arial" font-size="11" fill="#555">Skill tags, CV upload, AI gap recommendations, in-app apply flow</text>

  <circle cx="660" cy="495" r="7" fill="#5B9A1B"/>
  <text x="676" y="491" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#1a1a1a">Social layer + Achievement profile</text>
  <text x="676" y="508" font-family="Segoe UI, Arial" font-size="11" fill="#555">Event chatrooms, reactions, DMs, certificates, medal podium leaderboard</text>

       PHASE 1 QUICK WINS BANNER
  ══════════════════════════ -->

  <text x="52" y="574" font-family="Segoe UI, Arial" font-size="12" font-weight="700" fill="#0070F2">

  </text>

    Fix Android image distortion
  </text>

  <!-- Pill 2 -->
  <rect x="306" y="582" width="278" height="26" rx="13" fill="#0070F2"/>
  <text x="445" y="599" text-anchor="middle"

  </text>

  <!-- Pill 3 -->
  <rect x="598" y="582" width="240" height="26" rx="13" fill="#0070F2"/>
  <text x="718" y="599" text-anchor="middle"

  </text>
